<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css"> 
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">
  <title>戎糖小记</title>
  </head>
  <body>
    <header>
      <h1><a href="index.html"><img src="左logo.png" alt="logo"></a></h1>
      <ul>
            <li><a href="index.html">首页</a></li>
            <li><a href="works.html">我的作品</a></li>
            <li><a href="about.html">关于我们</a></li>
            <li><a href="contact.html">联系我们</a></li>
        </ul>
    </header>
    <main>
      <section class="firstpic-section">
        <div class="firstpic-container">
          <img src="firstpic.jpg" alt="firstpic" class="firstpic">
          <div class="firstpic-overlay"></div>
          <div class="firstpic-content">
            <h2>欢迎来到戎糖小记</h2>
            <p>这儿是一个展示作品和分享故事的地方</p>
          </div>
        </div>
      </section>

      <section class="carousel-section">
        <div class="title-text">最近展示</div>
        <div class="banner">
          <div class="swiper swi-banner" style="--arr: url('https://cdn.littletuan.com/third/ver202403/arr1.svg');">
            <div class="swiper-wrapper">
              <div class="swiper-slide">
                <div class="item has-link" data-href="time.html">
                  <div class="img-wrap"><img src="gd1.jpg" alt="图1"></div>
                </div>
              </div>
              <div class="swiper-slide">
                <div class="item has-link" data-href="https://mp.weixin.qq.com/s/Ydptq01KOBoXR7nXBdMh0Q">
                  <div class="img-wrap"><img src="gd2.jpg" alt="图2"></div>
                </div>
              </div>
              <div class="swiper-slide">
                <div class="item has-link" data-href="https://mp.weixin.qq.com/s/G9l5XR7qGsJamSHsWNJnXw">
                  <div class="img-wrap"><img src="gd3.jpg" alt="图3"></div>
                </div>
              </div>
              <div class="swiper-slide">
                <div class="item has-link" data-href="https://mp.weixin.qq.com/s/bEFJzfNgTC4qrh-viOcD5w">
                  <div class="img-wrap"><img src="gd4.jpg" alt="图4"></div>
                </div>
              </div>
              <div class="swiper-slide">
                <div class="item has-link" data-href="https://mp.weixin.qq.com/s/替换为图5链接">
                  <div class="img-wrap"><img src="gd5.jpg" alt="图5"></div>
                </div>
              </div>
            </div>
            <div class="swiper-button-prev"></div>
            <div class="swiper-button-next"></div>
            <div class="swiper-pagination"></div>
          </div>
        </div>
      </section>

    </main>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script>
      const swiper = new Swiper('.swi-banner', {
        loop: true,
        centeredSlides: true,
        slidesPerView: 'auto',
        spaceBetween: 24,
        autoplay: {
          delay: 3000,
          disableOnInteraction: false,
        },
        navigation: {
          prevEl: '.swiper-button-prev',
          nextEl: '.swiper-button-next',
        },
        pagination: {
          el: '.swiper-pagination',
          clickable: true,
        },
      });

      // 点击有链接的 slide 跳转
      document.querySelectorAll('.swi-banner .item.has-link').forEach(item => {
        item.addEventListener('click', () => {
          const href = item.dataset.href;
          if (!href) return;
          if (href === 'time.html') {
            window.location.href = href;
          } else {
            window.open(href, '_blank');
          }
        });
      });
    </script>
  </body>
</html>
