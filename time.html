<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>倒计时 - 戎糖小记</title>
  <style>
    .back-btn {
      position: fixed;
      top: 100px;
      left: 40px;
      width: 70px;
      height: 70px;
      background: rgba(255, 188, 197, 0.8);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s;
      box-shadow: 0 2px 10px rgba(255, 188, 197, 0.4);
    }

    .back-btn:hover {
      background: #ffbcc5;
      transform: scale(1.1);
    }

    .back-btn .back-arrow {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #fff;
    }

    .back-btn .back-text {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .countdown-section {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .countdown-title {
      font-size: 28px;
      font-weight: 600;
      color: #333;
      padding: 8px 35px;
      position: relative;
      display: inline-block;
      margin-bottom: 50px;
    }

    .countdown-title::after {
      content: '';
      position: absolute;
      top: 0;
      left: -65px;
      width: calc(100% + 130px);
      height: 100%;
      background-color: #ffbcc5;
      border-radius: 20px;
      z-index: -1;
    }

    .countdown-container {
      display: flex;
      gap: 50px;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .countdown-number {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #ffbcc5, #ff9a9e);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 72px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 30px rgba(255, 188, 197, 0.4);
      margin-bottom: 20px;
    }

    .countdown-label {
      font-size: 24px;
      color: #666;
      font-weight: 800;
    }

    .countdown-desc {
      margin-top: 40px;
      font-size: 20px;
      color: #888;
    }

    @media (max-width: 768px) {
      .back-btn {
        width: 55px;
        height: 55px;
        top: 80px;
        left: 15px;
      }

      .back-btn .back-text {
        font-size: 12px;
      }

      .back-btn .back-arrow {
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-right: 6px solid #fff;
      }

      .countdown-section {
        padding: 20px 15px;
      }

      .countdown-title {
        font-size: 20px;
        padding: 6px 20px;
        margin-bottom: 30px;
      }

      .countdown-title::after {
        left: -30px;
        width: calc(100% + 60px);
      }

      .countdown-container {
        gap: 15px;
      }

      .countdown-number {
        width: 70px;
        height: 70px;
        font-size: 32px;
        margin-bottom: 10px;
        border-radius: 12px;
      }

      .countdown-label {
        font-size: 14px;
      }

      .countdown-desc {
        margin-top: 25px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><img src="左logo.png" alt="logo"></h1>
    <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="works.html">我的作品</a></li>
          <li><a href="about.html">关于我们</a></li>
          <li><a href="contact.html">联系我们</a></li>
      </ul>
  </header>
  <main>
    <div class="back-btn" onclick="window.location.href='index.html'">
      <div class="back-arrow"></div>
      <div class="back-text">返回</div>
    </div>
    <section class="countdown-section">
      <div class="countdown-title">距离目标时间</div>
      <div class="countdown-container">
        <div class="countdown-item">
          <div class="countdown-number" id="days">00</div>
          <div class="countdown-label">天</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="hours">00</div>
          <div class="countdown-label">时</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="minutes">00</div>
          <div class="countdown-label">分</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="seconds">00</div>
          <div class="countdown-label">秒</div>
        </div>
      </div>
      <div class="countdown-desc">期待那一天的到来...</div>
    </section>
  </main>
  <script>
    const targetDate = new Date('2026-12-20 00:00:00');

    function updateCountdown() {
      const now = new Date();
      const diff = targetDate - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
