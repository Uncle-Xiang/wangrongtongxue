<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a1a">
  <link rel="stylesheet" href="style.css">
  <title>倒计时 - 戎糖小记</title>
  <style>
    html, body {
      min-height: 100vh;
      min-height: 100dvh; /* 移动端动态视口高度，避免地址栏伸缩导致跳动 */
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      overscroll-behavior: none; /* 防止下拉刷新 / 上滑回弹干扰烟花触摸 */
    }

    body {
      min-height: 100vh;
    }

    /* 安全区适配（刘海屏 / 底部 Home 条） */
    .back-btn {
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) 0 env(safe-area-inset-left, 0);
    }

    body.celebrating {
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1033 30%, #2d1b4e 60%, #0d0a24 100%);
    }

    .back-btn {
      position: fixed;
      top: 100px;
      left: 40px;
      width: 70px;
      height: 70px;
      background: rgba(255, 188, 197, 0.8);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      z-index: 100;
      transition: all 0.3s;
      box-shadow: 0 2px 10px rgba(255, 188, 197, 0.4);
    }

    .back-btn:hover {
      background: #ffbcc5;
      transform: scale(1.1);
    }

    .back-btn .back-arrow {
      width: 0;
      height: 0;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
      border-right: 8px solid #fff;
    }

    .back-btn .back-text {
      color: #fff;
      font-size: 14px;
      font-weight: 600;
    }

    .countdown-section {
      min-height: calc(100vh - 120px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 40px;
    }

    .countdown-title {
      font-size: 28px;
      font-weight: 600;
      color: #333;
      padding: 8px 35px;
      position: relative;
      display: inline-block;
      margin-bottom: 50px;
    }

    body.celebrating .countdown-title {
      color: #fff;
      letter-spacing: 6px;
    }

    .countdown-title::after {
      content: '';
      position: absolute;
      top: 0;
      left: -65px;
      width: calc(100% + 130px);
      height: 100%;
      background-color: #ffbcc5;
      border-radius: 20px;
      z-index: -1;
    }

    .countdown-container {
      display: flex;
      gap: 50px;
    }

    .countdown-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .countdown-number {
      width: 160px;
      height: 160px;
      background: linear-gradient(135deg, #ffbcc5, #ff9a9e);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 72px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 10px 30px rgba(255, 188, 197, 0.4);
      margin-bottom: 20px;
    }

    .countdown-label {
      font-size: 24px;
      color: #666;
      font-weight: 800;
    }

    body.celebrating .countdown-label {
      color: rgba(255,255,255,0.85);
    }

    .countdown-desc {
      margin-top: 40px;
      font-size: 20px;
      color: #888;
    }

    body.celebrating .countdown-desc {
      color: rgba(255,255,255,0.6);
    }

    .celebration {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 40px 20px;
    }

    .celebration.show {
      display: flex;
    }

    .celebration-title {
      font-size: 64px;
      font-weight: 800;
      color: #fff;
      text-shadow: 0 4px 20px rgba(255, 154, 158, 0.5);
      letter-spacing: 12px;
      background: linear-gradient(135deg, #ff9a9e, #ff6b6b);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: celebrate-pop 0.8s ease;
    }

    .celebration-subtitle {
      font-size: 26px;
      color: #ff6b6b;
      font-weight: 600;
      letter-spacing: 2px;
    }

    .celebration-emoji {
      font-size: 80px;
      animation: celebrate-bounce 1.5s ease infinite;
    }

    @keyframes celebrate-pop {
      0% { transform: scale(0.3); opacity: 0; }
      60% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes celebrate-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    #fireworks-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh; /* 移动端动态视口高度，地址栏伸缩不影响 */
      pointer-events: none;
      z-index: 9999;
    }

    @media (max-width: 768px) {
      .back-btn {
        width: 55px;
        height: 55px;
        top: 80px;
        left: 15px;
      }

      .back-btn .back-text {
        font-size: 12px;
      }

      .back-btn .back-arrow {
        border-top: 5px solid transparent;
        border-bottom: 5px solid transparent;
        border-right: 6px solid #fff;
      }

      .countdown-section {
        padding: 20px 15px;
      }

      .countdown-title {
        font-size: 20px;
        padding: 6px 20px;
        margin-bottom: 30px;
      }

      .countdown-title::after {
        left: -30px;
        width: calc(100% + 60px);
      }

      .countdown-container {
        gap: 15px;
      }

      .countdown-number {
        width: 70px;
        height: 70px;
        font-size: 32px;
        margin-bottom: 10px;
        border-radius: 12px;
      }

      .countdown-label {
        font-size: 14px;
      }

      .countdown-desc {
        margin-top: 25px;
        font-size: 14px;
      }

      .celebration-title {
        font-size: 40px;
        letter-spacing: 6px;
      }

      .celebration-subtitle {
        font-size: 16px;
        letter-spacing: 1px;
      }

      .celebration-emoji {
        font-size: 56px;
      }
    }

    /* 超窄屏（iPhone SE / 折叠屏外屏）进一步压缩 */
    @media (max-width: 380px) {
      .back-btn {
        width: 48px;
        height: 48px;
        top: 70px;
        left: 10px;
      }

      .back-btn .back-text {
        font-size: 11px;
      }

      .back-btn .back-arrow {
        border-top: 4px solid transparent;
        border-bottom: 4px solid transparent;
        border-right: 5px solid #fff;
      }

      .countdown-section {
        padding: 15px 10px;
      }

      .countdown-title {
        font-size: 17px;
        padding: 5px 16px;
        margin-bottom: 24px;
      }

      .countdown-title::after {
        left: -22px;
        width: calc(100% + 44px);
      }

      .countdown-container {
        gap: 10px;
      }

      .countdown-number {
        width: 60px;
        height: 60px;
        font-size: 26px;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(255, 188, 197, 0.35);
      }

      .countdown-label {
        font-size: 12px;
      }

      .countdown-desc {
        margin-top: 20px;
        font-size: 12px;
      }

      .celebration {
        padding: 24px 12px;
        gap: 16px;
      }

      .celebration-title {
        font-size: 32px;
        letter-spacing: 4px;
      }

      .celebration-subtitle {
        font-size: 13px;
        letter-spacing: 1px;
      }

      .celebration-emoji {
        font-size: 44px;
      }
    }

    /* 横屏（手机躺平）：垂直空间紧张，压缩返回按钮 + 顶部留白 */
    @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
      .back-btn {
        top: 20px;
        left: 20px;
        width: 48px;
        height: 48px;
      }

      .countdown-section {
        padding: 30px 15px 20px;
        min-height: calc(100dvh - 80px);
      }

      .countdown-title {
        font-size: 18px;
        margin-bottom: 16px;
      }

      .countdown-number {
        width: 64px;
        height: 64px;
        font-size: 28px;
        margin-bottom: 6px;
      }

      .celebration-title {
        font-size: 36px;
        letter-spacing: 5px;
      }

      .celebration-emoji {
        font-size: 48px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1><a href="index.html"><img src="左logo.png" alt="logo"></a></h1>
    <ul>
          <li><a href="index.html">首页</a></li>
          <li><a href="works.html">我的作品</a></li>
          <li><a href="about.html">关于我们</a></li>
          <li><a href="contact.html">联系我们</a></li>
      </ul>
  </header>
  <main>
    <div class="back-btn" onclick="window.location.href='index.html'">
      <div class="back-arrow"></div>
      <div class="back-text">返回</div>
    </div>
    <section class="countdown-section">
      <div class="countdown-title">距离目标时间</div>
      <div class="countdown-container">
        <div class="countdown-item">
          <div class="countdown-number" id="days">00</div>
          <div class="countdown-label">天</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="hours">00</div>
          <div class="countdown-label">时</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="minutes">00</div>
          <div class="countdown-label">分</div>
        </div>
        <div class="countdown-item">
          <div class="countdown-number" id="seconds">00</div>
          <div class="countdown-label">秒</div>
        </div>
      </div>
      <div class="countdown-desc">期待那一天的到来...</div>
      <div class="celebration" id="celebration">
        <div class="celebration-emoji">🎉</div>
        <div class="celebration-title">祝王戎一万天快乐</div>
        <div class="celebration-subtitle">愿你永远被爱意包围，幸福绵长 ✨</div>
      </div>
    </section>
    <canvas id="fireworks-canvas"></canvas>
  </main>
  <script>
    const targetDate = new Date('2026-12-20 00:00:00');
    // 测试模式：URL 加 ?test 即可立即触发庆祝效果
    const isTest = new URLSearchParams(location.search).has('test');
    let countdownEnded = false;

    function updateCountdown() {
      const now = new Date();
      const diff = isTest ? -1 : targetDate - now;

      if (diff <= 0) {
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
        // 倒计时归零，显示祝贺界面并启动烟花
        if (!countdownEnded) {
          countdownEnded = true;
          document.body.classList.add('celebrating');
          document.querySelector('.countdown-title').textContent = '今天是2026年12月20日星期日';
          document.querySelector('.countdown-desc').style.display = 'none';
          document.querySelector('.countdown-container').style.display = 'none';
          document.getElementById('celebration').classList.add('show');
          autoLaunch();
        }
        return;
      }

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((diff % (1000 * 60)) / 1000);

      document.getElementById('days').textContent = String(days).padStart(2, '0');
      document.getElementById('hours').textContent = String(hours).padStart(2, '0');
      document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
      document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
    }

    // 倒计时初始化（放在烟花代码之后，避免变量未初始化）
    // updateCountdown();
    // setInterval(updateCountdown, 1000);

    // ===== 烟花效果（点击 + 自动烟花桶）=====
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let rockets = [];
    const dpr = Math.max(1, Math.min(window.devicePixelRatio || 1, 2)); // 限制最大 2，避免高分屏性能爆掉
    // 手机端粒子规模系数：屏越窄粒子越少，保证流畅
    const particleScale = window.innerWidth < 380 ? 0.5
                       : window.innerWidth < 600 ? 0.7
                       : 1;
    // 光晕系数：移动端降低 shadowBlur（Canvas 最耗性能的操作）
    const glowScale = window.innerWidth < 600 ? 0.4 : 1;

    // CSS 像素宽高（烟花逻辑用这个，避免每次取 window.innerWidth）
    let cw = window.innerWidth;
    let ch = window.innerHeight;

    function resizeCanvas() {
      cw = window.innerWidth;
      ch = window.innerHeight;
      canvas.style.width = cw + 'px';
      canvas.style.height = ch + 'px';
      canvas.width = Math.floor(cw * dpr);
      canvas.height = Math.floor(ch * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); // 用 CSS 像素作坐标
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);
    window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 200));

    // 烟花配色
    const fireworkColors = [
      '#ff6b6b', '#ff9a9e', '#ffd1d1',
      '#ffd93d', '#ff9a3d', '#ffe7a0',
      '#6bcb77', '#4dd0e1', '#9b72cb',
      '#ff8fab', '#c9b6ff', '#7bf1a8'
    ];

    function createFirework(x, y) {
      const count = Math.floor((50 + Math.floor(Math.random() * 60)) * particleScale);
      const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
      const shape = Math.random();

      // 烟花类型：0-0.25 双层环 / 0.25-0.55 椭圆 / 0.55-0.75 标准圆 / 0.75-0.85 心形 / 0.85-1 散射星形
      if (shape < 0.25) {
        // 双层环：外圈快、内圈慢
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
          let speed = 2 + Math.random() * 6;
          if (i % 2 === 0) speed *= 1.5;
          else speed *= 0.6;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.008 + Math.random() * 0.015,
            color,
            size: 1.5 + Math.random() * 3
          });
        }
      } else if (shape < 0.55) {
        // 椭圆：纵向压缩
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
          const speed = 2 + Math.random() * 6;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed * 0.6,
            life: 1,
            decay: 0.008 + Math.random() * 0.015,
            color,
            size: 1.5 + Math.random() * 3
          });
        }
      } else if (shape < 0.75) {
        // 标准圆形
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.3;
          const speed = 2 + Math.random() * 6;
          particles.push({
            x, y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            decay: 0.008 + Math.random() * 0.015,
            color,
            size: 1.5 + Math.random() * 3
          });
        }
      } else if (shape < 0.85) {
        // 心形
        for (let i = 0; i < count; i++) {
          const t = (Math.PI * 2 * i) / count;
          const scale = 3 + Math.random() * 4;
          // 心形参数方程
          const hx = 16 * Math.pow(Math.sin(t), 3);
          const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
          particles.push({
            x, y,
            vx: hx * scale * 0.3,
            vy: hy * scale * 0.3,
            life: 1,
            decay: 0.008 + Math.random() * 0.015,
            color: '#ff6b6b',
            size: 1.5 + Math.random() * 3
          });
        }
      } else {
        // 散射星形：多方向放射
        const arms = 5 + Math.floor(Math.random() * 3);
        for (let i = 0; i < count; i++) {
          const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.2;
          const armIndex = Math.floor((angle / (Math.PI * 2)) * arms);
          const armAngle = (armIndex / arms) * Math.PI * 2;
          const dist = 0.3 + Math.random() * 0.7;
          particles.push({
            x, y,
            vx: Math.cos(armAngle) * dist * 8,
            vy: Math.sin(armAngle) * dist * 8,
            life: 1,
            decay: 0.008 + Math.random() * 0.015,
            color,
            size: 1.5 + Math.random() * 3
          });
        }
      }
    }

    // 发射烟花桶：从屏幕底部随机位置升空，到达随机高度后爆炸
    function launchRocket() {
      const startX = cw * (0.05 + Math.random() * 0.9);
      const targetY = ch * (0.1 + Math.random() * 0.45);
      const color = fireworkColors[Math.floor(Math.random() * fireworkColors.length)];
      rockets.push({
        x: startX,
        y: ch + 10,
        vx: (Math.random() - 0.5) * 3,
        vy: -(7 + Math.random() * 6),
        targetY: targetY,
        color: color,
        trail: []
      });
    }

    function animateFireworks() {
      ctx.clearRect(0, 0, cw, ch);

      // 更新上升中的烟花桶
      rockets = rockets.filter(r => {
        r.trail.push({ x: r.x, y: r.y });
        if (r.trail.length > 8) r.trail.shift();

        r.x += r.vx;
        r.y += r.vy;
        r.vy += 0.08; // 重力减速

        // 到达目标高度或速度反转时爆炸
        if (r.y <= r.targetY || r.vy >= 0) {
          createFirework(r.x, r.y);
          return false;
        }

        // 绘制上升拖尾
        ctx.shadowColor = r.color;
        ctx.shadowBlur = 12 * glowScale;
        r.trail.forEach((t, i) => {
          ctx.globalAlpha = (i / r.trail.length) * 0.6;
          ctx.fillStyle = r.color;
          ctx.beginPath();
          ctx.arc(t.x, t.y, 2.5, 0, Math.PI * 2);
          ctx.fill();
        });
        // 烟花桶头部
        ctx.globalAlpha = 1;
        ctx.fillStyle = r.color;
        ctx.beginPath();
        ctx.arc(r.x, r.y, 3, 0, Math.PI * 2);
        ctx.fill();
        return true;
      });

      // 更新爆炸粒子
      particles = particles.filter(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.06;
        p.vx *= 0.99;
        p.life -= p.decay;

        if (p.life <= 0) return false;

        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();

        ctx.shadowColor = p.color;
        ctx.shadowBlur = 8 * glowScale;
        return true;
      });
      ctx.globalAlpha = 1;
      ctx.shadowBlur = 0;

      requestAnimationFrame(animateFireworks);
    }
    animateFireworks();

    // 启动倒计时（放在烟花代码之后，确保 autoLaunch 引用的变量已初始化）
    updateCountdown();
    setInterval(updateCountdown, 1000);

    // 自动发射烟花桶（仅在倒计时结束后由 updateCountdown 触发）
    function autoLaunch() {
      if (!countdownEnded) return;
      launchRocket();
      setTimeout(autoLaunch, 800 + Math.random() * 1200);
    }

    // 点击屏幕触发烟花（仅倒计时结束后）
    // 节流：连续点击最多 80ms 一次，避免手机连点粒子爆掉帧率
    let lastFireAt = 0;
    function tryFireAt(x, y, target) {
      if (!countdownEnded) return;
      // 烟花画布本身 pointer-events:none，不会拦截；这里只跳过交互控件
      if (target.closest && target.closest('.back-btn, header a, header, .swiper-button-prev, .swiper-button-next, .swiper-pagination-bullet')) return;
      const now = performance.now();
      if (now - lastFireAt < 80) return;
      lastFireAt = now;
      createFirework(x, y);
    }

    document.addEventListener('click', (e) => {
      tryFireAt(e.clientX, e.clientY, e.target);
    });

    // 触摸支持：手机端主力交互
    document.addEventListener('touchstart', (e) => {
      if (!countdownEnded) return;
      // 多指不处理
      if (e.touches.length > 1) return;
      const touch = e.touches[0];
      const t = e.target;
      // 点击交互控件时放行，让后续 click 正常触发
      if (t.closest && t.closest('.back-btn, header a, header, .swiper-button-prev, .swiper-button-next, .swiper-pagination-bullet')) return;
      tryFireAt(touch.clientX, touch.clientY, t);
      // 否则阻止合成 click 与页面滚动，避免重复烟花 / 庆祝界面被拖动
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
</html>
